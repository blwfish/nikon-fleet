# EXPERIMENT (2026-10-30), run by hand: `gh workflow run gui-flake-check.yml --ref claude/shared-tk-root`.
# Is the intermittent gui-python failure on macOS (a segfault in Tk 9.0's AppKit menu code on one run,
# a CoreFoundation "process has forked" message in captured stderr on another) caused by the tests
# creating and destroying a Tk root per test? Same suite, same Python/Tk, many independent runner VMs:
#   control  = master's tests (a Tk root per test)
#   shared   = this branch's tests (one Tk root for the whole session, reset between tests)
# Not triggered by push or pull_request on purpose: control failures are the thing being measured.
# Delete this file once the numbers are in.
name: gui-flake-check

on:
  workflow_dispatch:

jobs:
  gui:
    name: ${{ matrix.variant }} #${{ matrix.run }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [control, shared]
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'control' && 'master' || github.sha }}
      - run: rustup update stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-
      - run: cargo build -p nikon-fleet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'))"
      - run: python -m pip install pytest pytest-timeout
      - run: python -m pytest -v --timeout=120 --timeout-method=thread
        working-directory: gui
