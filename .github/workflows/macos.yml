# Does the macOS build work, and do its tests pass? macOS is where the CLI, the MCP server and both
# GUIs are used day to day, and until this job existed the only CI was windows.yml. No camera, Nikon
# SDK or Nikon account is involved: sdk-runtime/ is gitignored (not redistributable), so everything
# here must pass without it.
#
# Three jobs, so a failure in one does not hide the others:
#   rust       the library, the CLI, the egui GUI and the MCP server's unit tests
#   mcp-stdio  fleet-mcp's stdio integration tests, non-blocking until they are SDK-free (see below)
#   gui-python the Python/tk GUI's tests (gui/test_*.py), against the CLI built here
name: macos

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The crates are edition 2024: needs Rust 1.85 or newer.
      - run: rustup update stable
      - run: rustc --version && cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-
      - run: cargo build --workspace
      # GitHub sets CI=true, which makes the tests that need the Nikon SDK's files (sdk-runtime/)
      # fail instead of skip; this job has none, so it is turned off here, same as windows.yml.
      # fleet-mcp's stdio integration tests are in their own job; its unit tests run here.
      - run: cargo test --workspace --exclude fleet-mcp --no-fail-fast
        env:
          CI: "0"
      - run: cargo test -p fleet-mcp --lib --bins --no-fail-fast
        env:
          CI: "0"

  # mcp/tests/stdio.rs spawns the real server. The first CI run showed the one failure here was
  # `snapshots_are_listed_read_and_diffed_by_name`: `diff_snapshots` needs the gitignored
  # sdk-runtime/MaidLayer.config, and the test is now gated on it like the baseline and labels tests.
  # Locally, a second test (a "server did not exit" timeout at stdio.rs:202, a different test each run)
  # also failed once under load; it did not fail on the runner. `continue-on-error` stays until this
  # job has been green on a few runs, then remove it.
  mcp-stdio:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-
      - run: cargo test -p fleet-mcp --test stdio --no-fail-fast
        env:
          CI: "0"

  gui-python:
    runs-on: macos-latest
    timeout-minutes: 20
    # The Python/tk GUI is supported on Python 3.14 with Tk 9.0 only (see AGENT-README.md,
    # "Supported GUI environment"): on Tk 8.6 (python.org Python 3.13 and older) the GUI tests hang
    # inside Tk's `update`. Found 2026-10-30 on 3.12 (Tk 8.6.16) and 3.13 (Tk 8.6.18); not diagnosed.
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-
      # The tests that run the real binary on camera-free commands look for target/debug/nikon-fleet.
      - run: cargo build -p nikon-fleet
      # setup-python's interpreters ship tkinter, which the GUI tests need.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'))"
      - run: python -m pip install pytest pytest-timeout
      # CI=true is left on here on purpose: gui/conftest.py then makes a missing binary, tkinter or
      # display a failure instead of a silent skip, so this job cannot pass by skipping everything.
      # The first run of this job hung in pytest for over two hours (the suite takes about a minute
      # locally). -v names the test that is running, and --timeout dumps every thread's stack and
      # fails the run if one test takes more than 2 minutes, so the next hang names its own cause.
      - run: python -m pytest -v --timeout=120 --timeout-method=thread
        working-directory: gui
