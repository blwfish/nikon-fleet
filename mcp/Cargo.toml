[package]
name = "fleet-mcp"
version = "0.1.0"
edition = "2024"
description = "Optional MCP server for nikon-fleet (docs/mcp-plan.md). Nothing else depends on it."

[[bin]]
name = "fleet-mcp"
path = "src/main.rs"

[dependencies]
nikon-fleet = { path = ".." }
# Exact pins: rmcp-macros floats to a newer minor unless pinned separately (docs/mcp-plan.md §3).
# Keep Cargo.lock committed and never run a blanket `cargo update`.
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
rmcp-macros = "=3.5.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
