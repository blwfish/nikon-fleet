[workspace]
members = ["gui", "mcp"]

[package]
name = "nikon-fleet"
version = "0.1.0"
edition = "2024"
description = "Fleet-wide settings management for Nikon Z cameras"

[dependencies]
# CLI parsing — derive-style, very ergonomic
clap = { version = "4", features = ["derive"] }

# JSON serialization for snapshots
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling. Two crates that play different roles:
#   anyhow:    great for application code; "any error" with context chaining.
#   thiserror: great for library code; lets you define your own error enums.
# We'll mostly use anyhow at the boundary and thiserror in the parser modules.
anyhow = "1"
thiserror = "2"

# Timestamps on snapshots
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Dynamic library loading. The Nikon SDK is a CFBundle containing a regular
# Mach-O dylib; libloading wraps dlopen/dlsym safely (within FFI's limits).
libloading = "0.8"

# libc gives us size_t and malloc/free for the SDK's allocator callbacks.
libc = "0.2"

# USB device access: read bcdDevice (firmware version) and iSerialNumber from
# the USB descriptor, and reset cameras so the SDK's IOKit notifications fire.
rusb = "0.9"

# SHA-256 hashing for firmware archive integrity checks.
sha2 = "0.10"

# Blocking HTTP and HTML parsing for the firmware source (src/firmware_source.rs).
ureq = "2"
scraper = "0.29.0"

# Scratch directory for downloads before they are verified and archived (also used by tests).
tempfile = "3"

# URL parsing for the browse window's page/navigation checks (already in the tree via ureq).
url = "2"

# Embedded browser for `fleet firmware browse` (cargo feature `webview`).
# tao = windowing/event loop, wry = the OS web view (WKWebView on macOS,
# WebView2 on Windows, WebKitGTK on Linux). Off by default so plain CLI
# builds don't pull in the GUI stack; see docs/firmware-source-findings.md §6.
wry = { version = "0.57.1", optional = true }
tao = { version = "0.37.2", optional = true }

# FTP and SFTP clients for `ftp-test` (src/ftp_test.rs): connect, log in, change into the folder, put a small file, get
# it back, compare, delete it. suppaftp without any TLS feature (plain FTP); russh and russh-sftp are pure Rust (no
# libssh2 or OpenSSL to build) and async, so the test runs a small current-thread tokio runtime of its own.
suppaftp = { version = "12", default-features = false }
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }

# macOS dev builds default to `split-debuginfo = "unpacked"`, which keeps every build's object files (a few hundred
# `.rcgu.o` per rebuild of a crate) in target/debug/deps for ever; cargo never removes them. A pile of 733,000 of them made
# the first launch of every newly linked executable stall for ~30 s while `syspolicyd` scanned the directory. "packed" runs
# dsymutil, keeps one .dSYM per binary and deletes the objects. Measured: no growth over repeated relinks, relink 2.1 s.
[profile.dev]
split-debuginfo = "packed"

[features]
webview = ["dep:wry", "dep:tao"]

# Display-needed smoke test of the embedded browser against a local page that
# triggers its own download (never Nikon's gate): `cargo run --example webview_smoke --features webview`.
[[example]]
name = "webview_smoke"
required-features = ["webview"]

[dev-dependencies]
# Nicer assertion output for tests
pretty_assertions = "1"
# A throwaway host key for the in-process SFTP server the `ftp_test` tests talk to (russh uses rand 0.10).
rand = "0.10"
